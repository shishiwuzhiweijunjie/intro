<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[HEADHUNTING TERMINAL] | 寻访系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ================= 核心机能风变量 ================= */
        :root {
            --bg-main: #f4f6f9;            
            --bg-card: #ffffff;            
            --accent-yellow: #ffc400;      
            --tech-blue: #00b0ff;          
            --tech-grey: #94a3b8;          
            --text-dark: #121214;          
            --text-muted: #6c727f;         
            --border-color: #d1d5db;       
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            font-family: 'Consolas', 'Segoe UI', system-ui, sans-serif;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        * { border-radius: 0 !important; }

        /* ================= 背景微排版装饰 ================= */
        .hg-bg-watermark {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2; overflow: hidden;
        }
        .watermark-text {
            position: absolute; top: 20%; right: -5%;
            font-size: 12rem; font-weight: 900; color: rgba(0, 0, 0, 0.015);
            transform: rotate(-90deg); white-space: nowrap; font-family: 'Arial Black', sans-serif;
        }

        .crosshair {
            position: fixed; width: 24px; height: 24px; pointer-events: none; z-index: -1;
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: rgba(18, 18, 20, 0.25);
        }
        .crosshair::before { width: 100%; height: 1px; top: 50%; left: 0; }
        .crosshair::after { width: 1px; height: 100%; top: 0; left: 50%; }
        .top-left { top: 2%; left: 2%; }
        .top-right { top: 2%; right: 2%; }
        .bottom-left { bottom: 2%; left: 2%; }
        .bottom-right { bottom: 2%; right: 2%; }

        #particles-js { position: fixed; width: 100%; height: 100%; background: transparent; z-index: -1; }

        /* ================= 导航栏 ================= */
        .navbar {
            background: rgba(255, 255, 255, 0.92) !important; border-bottom: 2px solid var(--text-dark);
            backdrop-filter: blur(15px); padding: 12px 0;
        }
        .navbar-brand { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; color: var(--text-dark) !important; text-transform: uppercase; }
        .navbar-brand span { background: var(--text-dark); color: var(--accent-yellow); padding: 2px 6px; margin-right: 8px; }
        .nav-link { font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: var(--text-muted) !important; text-transform: uppercase; }
        .nav-link:hover { color: var(--text-dark) !important; border-bottom: 2px solid var(--text-dark); }

        /* ================= 寻访控制台 ================= */
        .hg-title-main {
            font-size: 2.5rem; font-weight: 900; letter-spacing: 4px;
            color: var(--text-dark); text-transform: uppercase;
            border-left: 6px solid var(--text-dark); padding-left: 20px;
            display: inline-block; margin-bottom: 10px;
        }

        .pull-btn {
            font-size: 0.9rem; font-weight: 900; letter-spacing: 2px;
            padding: 12px 30px; border: 1px solid var(--border-color);
            background: var(--bg-card); color: var(--text-dark);
            text-transform: uppercase; transition: all 0.2s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            position: relative; overflow: hidden;
        }
        .pull-btn.primary { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }
        .pull-btn.primary:hover { background: var(--accent-yellow); color: var(--text-dark); }
        .pull-btn:hover { background: #eef1f6; border-color: var(--text-dark); transform: scale(1.02); }

        .pity-counter {
            background: #ffffff; border: 1px solid var(--border-color);
            padding: 1.5rem; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            position: relative;
        }
        .pity-counter::before {
            content: 'SYS.PITY_TRACKER'; position: absolute; top: 5px; right: 10px; font-size: 0.6rem; color: var(--text-muted); font-family: monospace;
        }
        .pity-label { font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; color: var(--text-dark); text-transform: uppercase; }
        .pity-progress { width: 150px; height: 6px; background: #e4e7ec; border: 1px solid #d1d5db; overflow: hidden; }
        .pity-progress-bar { height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        #fiveStarProgress { background: var(--accent-yellow); }
        #fourStarProgress { background: var(--tech-blue); }
        .pity-count-text { font-family: monospace; font-weight: 900; font-size: 0.9rem; color: var(--text-dark); }

        /* ================= 档案卡片/翻牌系统 ================= */
        .flip-card { perspective: 1000px; width: 100%; height: 260px; margin: 10px auto; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
            animation: flipIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes flipIn {
            0% { transform: rotateY(90deg) scale(0.9) translateX(50%); opacity: 0; }
            100% { transform: rotateY(0deg) scale(1) translateX(0); opacity: 1; }
        }

        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border: 1px solid var(--border-color);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }
        
        .flip-card-back {
            background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #f1f5f9 10px, #f1f5f9 20px);
            border: 1px solid var(--border-color); transform: rotateY(180deg); display: flex; align-items: center; justify-content: center;
        }
        .flip-card-back::after { content: 'TOP SECRET //'; font-weight: 900; color: var(--text-muted); opacity: 0.5; }

        .flip-card-front { background-color: var(--bg-card); display: flex; flex-direction: column; padding: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }

        .hg-card-label { font-size: 0.6rem; font-weight: 900; letter-spacing: 2px; padding: 4px 10px; text-transform: uppercase; font-family: monospace; }
        
        .five-star { background: var(--text-dark); color: #fff; border: 1px solid var(--accent-yellow); }
        .five-star .hg-card-label { background: var(--accent-yellow); color: var(--text-dark); }
        .five-star .item-name { color: #fff; }
        
        .four-star { background: #ffffff; border: 1px solid var(--tech-blue); }
        .four-star .hg-card-label { background: var(--tech-blue); color: #fff; }
        
        .three-star { background: #f8fafc; border: 1px solid var(--border-color); }
        .three-star .hg-card-label { background: var(--tech-grey); color: #fff; }

        .card-content { padding: 1.5rem; text-align: left; height: 100%; display: flex; flex-direction: column; }
        .rarity-stars { font-size: 1.2rem; color: var(--accent-yellow); margin-bottom: auto; letter-spacing: 2px; }
        .item-name { font-size: 1.3rem; font-weight: 900; margin-top: auto; line-height: 1.2; text-transform: uppercase; }

        .badge-up { position: absolute; top: 10px; right: 10px; background: #e74c3c; color: #fff; font-size: 0.6rem; font-weight: bold; padding: 2px 6px; letter-spacing: 1px; }

        .character-card { height: 320px !important; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .five-star .stat-row { border-bottom-color: rgba(255,255,255,0.1); }
        .stat-label { font-family: monospace; color: var(--text-muted); }
        .five-star .stat-label { color: #a1a1aa; }
        .stat-val { font-weight: bold; }

        /* ================= 模态框 ================= */
        .modal-content { background: #ffffff; border: 1px solid var(--text-dark); clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
        .modal-header { background: var(--text-dark); color: #fff; border: none; padding: 15px 20px; }
        .modal-title { font-size: 1rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .btn-close { filter: invert(1); opacity: 1; }
        .modal-body { padding: 20px; }
        
        .history-item { border: 1px solid var(--border-color); padding: 10px 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .history-item.gold { border-left: 4px solid var(--accent-yellow); }
        .history-item.purple { border-left: 4px solid var(--tech-blue); }
        .history-item.blue { border-left: 4px solid var(--tech-grey); }

        .page-btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-dark); padding: 5px 15px; font-weight: bold; transition: all 0.2s; }
        .page-btn:not(:disabled):hover { background: var(--text-dark); color: #fff; }
        .page-btn:disabled { background: #f1f5f9; color: #cbd5e1; cursor: not-allowed; }

        .loader { width: 80px; height: 80px; position: relative; margin: 80px auto; }
        .outer, .inner { position: absolute; border: 2px solid transparent; animation: linear infinite; }
        .outer { width: 100%; height: 100%; border-top: 2px solid var(--text-dark); border-right: 2px solid var(--text-dark); animation-name: spin-outer; animation-duration: 1.5s; }
        .inner { width: 50%; height: 50%; border-bottom: 2px solid var(--accent-yellow); border-left: 2px solid var(--accent-yellow); top: 25%; left: 25%; animation-name: spin-inner; animation-duration: 1s; }
        @keyframes spin-outer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spin-inner { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* ================= 档案包裹互动拉链系统 (新增强核心互动) ================= */
        #gachaBagOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 9990;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        .bag-wrapper {
            position: relative; width: 80%; max-width: 600px; height: 100px;
            display: flex; align-items: center; justify-content: center;
        }

        /* 泄漏的光芒层 */
        .bag-glow {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
            box-shadow: 0 0 0px 0px transparent; transition: background 0.2s;
            z-index: 1; opacity: 0;
        }

        /* 互动拉链 */
        input[type=range].zipper {
            -webkit-appearance: none; width: 100%; background: transparent; z-index: 2; position: relative;
        }
        input[type=range].zipper:focus { outline: none; }
        input[type=range].zipper::-webkit-slider-runnable-track {
            width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px;
        }
        input[type=range].zipper::-webkit-slider-thumb {
            height: 50px; width: 24px; background: #fff;
            border: 3px solid #000; border-radius: 4px;
            cursor: pointer; -webkit-appearance: none; margin-top: -22px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.8);
        }

        /* 底部互动提示 */
        .instruction-text {
            color: #fff; font-family: monospace; letter-spacing: 6px;
            margin-top: 50px; font-weight: 900; font-size: 1.2rem;
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* 全屏白闪（拉开包的瞬间） */
        #whiteFlash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease-out;
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div id="particles-js"></div>
    <div class="hg-bg-watermark"><div class="watermark-text">HEADHUNTING // SYS.01</div></div>
    <div class="crosshair top-left"></div><div class="crosshair top-right"></div>
    <div class="crosshair bottom-left"></div><div class="crosshair bottom-right"></div>

    <!-- 寻访包全屏拉链互动层 -->
    <div id="gachaBagOverlay">
        <div class="bag-wrapper">
            <div class="bag-glow" id="bagGlow"></div>
            <input type="range" min="0" max="100" value="0" class="zipper" id="zipperSlider">
        </div>
        <div class="instruction-text">>>> DRAG TO UNPACK <<<</div>
    </div>
    
    <!-- 全屏高强度闪光弹 -->
    <div id="whiteFlash"></div>

    <div class="gacha-container">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="#"><span>//</span> 人才寻访终端</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto"><li class="nav-item" id="registerLink"><a class="nav-link" href="/">切断连接</a></li></ul>
                </div>
                <div id="authSection" class="d-flex align-items-center ms-3">
                    <div class="fw-bold me-3 text-dark" id="usernameDisplay" style="font-family: monospace;"></div>
                    <button class="btn btn-dark btn-sm rounded-0 fw-bold" onclick="logout()">LOGOUT</button>
                </div>
            </div>
        </nav>

        <div class="container" style="padding-top: 100px; padding-bottom: 50px;">
            <div class="text-center mb-5">
                <h1 class="hg-title-main mb-2">STANDARD HEADHUNTING</h1>
                <p class="text-muted fw-bold mb-4" style="letter-spacing: 2px;">// 常规人才寻访协议就绪</p>
                
                <div class="d-flex justify-content-center gap-3 mb-4">
                    <button class="pull-btn primary" onclick="pull(1)">寻访一次 // PULL 1</button>
                    <button class="pull-btn primary" onclick="pull(10)">寻访十次 // PULL 10</button>
                    <button class="pull-btn" onclick="showGachaHistory()">寻访记录 // LOGS</button>
                    <button class="pull-btn" onclick="showCharacters()">干员名册 // ROSTER</button>
                </div>

                <div class="pity-counter mt-3 text-start">
                    <div class="mb-3 d-flex align-items-center justify-content-between">
                        <span class="pity-label me-4">高级资深干员 (6★)</span>
                        <div class="d-flex align-items-center">
                            <div class="pity-progress me-3"><div id="fiveStarProgress" class="pity-progress-bar" style="width: 0%"></div></div>
                            <span id="fiveStarCount" class="pity-count-text">0/90</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-between">
                        <span class="pity-label me-4">资深干员保底 (5★)</span>
                        <div class="d-flex align-items-center">
                            <div class="pity-progress me-3"><div id="fourStarProgress" class="pity-progress-bar" style="width: 0%"></div></div>
                            <span id="fourStarCount" class="pity-count-text">0/10</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="charactersContainer" class="row g-4" style="display: none;"></div>
            <div class="row g-4" id="resultsContainer">
                <div id="gachaLoader" class="loader" style="display: none;">
                    <div class="outer"></div><div class="inner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 记录模态框 -->
    <div id="gachaHistoryModal" class="modal fade" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">SYS.HISTORY // 寻访记录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="closeModal()"></button>
                </div>
                <div class="modal-body"><div id="gachaHistoryContainer"><p class="text-muted fw-bold">数据加载中...</p></div></div>
                <div class="modal-footer d-flex justify-content-between align-items-center border-0 bg-light">
                    <div>
                        <button type="button" class="page-btn" id="prevPageBtn" onclick="prevPage()" disabled>&laquo; PREV</button>
                        <span id="currentPage" class="mx-3 fw-bold" style="font-family: monospace;">1</span>
                        <button type="button" class="page-btn" id="nextPageBtn" onclick="nextPage()" disabled>NEXT &raquo;</button>
                    </div>
                    <button type="button" class="btn btn-dark rounded-0 fw-bold" data-bs-dismiss="modal" onclick="closeModal()">CLOSE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        $(() => {
            const token = sessionStorage.getItem('token');
            if (!token) window.location.href = '/login';
            $('#logoutLink').toggle(!!token);
            $('#loginLink').toggle(!token);
        });

        // 存储待展示的数据
        let pendingResults = [];
        let pendingMeta = {};

        async function pull(times) {
            $('#charactersContainer').hide();
            const resultsContainer = $('#resultsContainer').show();
            resultsContainer.empty();
            showLoading(true);
            try {
                const res = await fetch('/gacha/pull', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ times })
                });

                const { success, data, error } = await res.json();
                if (!success) throw new Error(error || '寻访接口通讯失败');

                // 拿到数据后不直接展示，而是唤起档案袋互动
                pendingResults = data?.results || [];
                pendingMeta = data?.meta || {};
                
                // 计算包裹透出的最高星级光芒
                const maxRarity = Math.max(...pendingResults.map(r => r.rarity));
                
                showLoading(false);
                initGachaBagInteraction(maxRarity);

            } catch (err) {
                showLoading(false);
                showError(err.message);
            }
        }

        // 初始化互动包裹拉链系统
        function initGachaBagInteraction(maxRarity) {
            const overlay = $('#gachaBagOverlay');
            const slider = $('#zipperSlider');
            const glow = $('#bagGlow');
            
            // 重置状态
            slider.val(0);
            slider.prop('disabled', false);
            glow.css('opacity', 0);
            
            // 匹配方舟经典光芒配色
            let glowColor, shadowColor;
            if (maxRarity === 5) { // 6★：炙热火橙光
                glowColor = 'rgba(255, 69, 0, 1)';
                shadowColor = 'rgba(255, 69, 0, 0.8)';
            } else if (maxRarity === 4) { // 5★：金黄光
                glowColor = 'rgba(255, 215, 0, 1)';
                shadowColor = 'rgba(255, 215, 0, 0.8)';
            } else { // 3/4★：纯白微光
                glowColor = 'rgba(255, 255, 255, 1)';
                shadowColor = 'rgba(255, 255, 255, 0.6)';
            }

            glow.css({ 'background': glowColor, 'box-shadow': `0 0 0px 0px ${shadowColor}` });
            overlay.css('display', 'flex'); // 显示档案包裹层

            // 监听拉动拉链
            slider.off('input').on('input', function() {
                let val = $(this).val();
                let intensity = val / 100;
                
                // 随着拉链拉动，光芒越来越刺眼，范围越来越大
                glow.css({
                    'opacity': intensity,
                    'box-shadow': `0 0 ${val * 1.5}px ${val / 1.5}px ${shadowColor}`
                });
                
                // 拉链拉到底部（>= 99%）
                if (val >= 99) {
                    slider.prop('disabled', true); // 锁死拉链
                    $('#whiteFlash').css('opacity', 1); // 触发全屏白光
                    
                    // 等待白光最强时，卸载包裹层，印出结果
                    setTimeout(() => {
                        overlay.hide();
                        $('#whiteFlash').css('opacity', 0);
                        displayResults(pendingResults);
                        updatePity(pendingMeta);
                    }, 800); 
                }
            });
        }

        function displayResults(results = []) {
            const container = $('#resultsContainer').empty();
            if (!results.length) return container.html('<div class="col-12 text-center fw-bold mt-5">// 获取寻访数据失败或为空</div>');

            results.forEach((item, index) => {
                const rarity = item.rarity || 3;
                const rarityLabel = rarity === 5 ? '6-STAR' : (rarity === 4 ? '5-STAR' : '3-STAR');
                const card = `
                    <div class="col-md-3 mb-4">
                        <div class="flip-card">
                            <div class="flip-card-inner" style="animation-delay: ${index * 0.1}s;">
                                <div class="flip-card-back"></div>
                                <div class="flip-card-front ${getRarityClass(rarity)}">
                                    <div class="hg-card-label">RANK: ${rarityLabel}</div>
                                    ${item.isRateUp ? `<div class="badge-up">RATE UP</div>` : ''}
                                    <div class="card-content">
                                        <div class="rarity-stars">${'★'.repeat(rarity)}</div>
                                        <h4 class="item-name">${item.name || 'UNKNOWN'}</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.append(card);
            });
        }

        function getRarityClass(rarity) { return { 5: 'five-star', 4: 'four-star', 3: 'three-star' }[rarity] || 'three-star'; }

        function updatePity(meta = {}) {
            const fiveStarCount = meta.fiveStarPity || 0;
            const fourStarCount = meta.fourStarPity || 0;
            $('#fiveStarProgress').css('width', `${(fiveStarCount / 90) * 100}%`);
            $('#fourStarProgress').css('width', `${(fourStarCount / 10) * 100}%`);
            $('#fiveStarCount').text(`${fiveStarCount}/90`);
            $('#fourStarCount').text(`${fourStarCount}/10`);
        }

        function showLoading(show) {
            if(show) {
                $('#resultsContainer').html(`<div id="gachaLoader" class="loader"><div class="outer"></div><div class="inner"></div></div>`);
            }
        }
        function showError(msg) { $('#resultsContainer').html(`<div class="col-12 text-center text-danger fw-bold mt-5">// ERR: ${msg}</div>`); }
        function logout() { sessionStorage.clear(); window.location.href = '/'; }

        particlesJS("particles-js", {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: "#94a3b8" }, shape: { type: "circle" },
                opacity: { value: 0.4, random: false }, size: { value: 2, random: true },
                line_linked: { enable: true, distance: 150, color: "#94a3b8", opacity: 0.3, width: 1 },
                move: { enable: true, speed: 1.5, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
            },
            interactivity: { detect_on: "canvas", events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true }, modes: { grab: { distance: 160, line_linked: { opacity: 0.8 } }, push: { particles_nb: 2 } } },
            retina_detect: true
        });

        // ================= 寻访记录逻辑 =================
        let records = []; let currentPage = 1; let totalPages = 0; let itemsPerPage = 6; 
        function showGachaHistory() { $('#gachaHistoryModal').modal('show'); loadGachaHistory(); }
        async function loadGachaHistory() {
            const container = $('#gachaHistoryContainer');
            container.html('<p class="fw-bold">// FETCHING DATA...</p>');
            try {
                const res = await fetch('/gacha/history', { method: 'GET', headers: { 'Authorization': `Bearer ${sessionStorage.getItem('token')}` } });
                const { success, data, error } = await res.json();
                if (!success) throw new Error(error || '获取记录失败');
                records = data || []; displayGachaHistory();
            } catch (err) { container.html(`<p class="text-danger fw-bold">// ERR: ${err.message}</p>`); }
        }
        function displayGachaHistory() {
            const container = $('#gachaHistoryContainer');
            if (!records.length) return container.html('<p class="text-muted fw-bold">// NO DATA LOGGED</p>');
            totalPages = Math.ceil(records.length / itemsPerPage); currentPage = 1; 
            displayPage(); updatePaginationControls();
        }
        function displayPage() {
            const start = (currentPage - 1) * itemsPerPage;
            const pageRecords = records.slice(start, start + itemsPerPage);
            const historyList = pageRecords.map(record => {
                const colorClass = record.rarity === 5 ? 'gold' : (record.rarity === 4 ? 'purple' : 'blue');
                return `<div class="history-item ${colorClass}"><div><div class="fw-bold text-dark" style="font-size: 1.1rem; text-transform: uppercase;">${record.itemName} <span class="ms-2" style="font-size: 0.8rem; color: var(--text-muted);">${record.rarity}★</span></div><div class="text-muted" style="font-size: 0.75rem; font-family: monospace;">TIMESTAMP: ${new Date(record.createdAt).toLocaleString()}</div></div></div>`;
            }).join('');
            $('#gachaHistoryContainer').html(historyList);
            $('#currentPage').text(`PG.${currentPage}`);
        }
        function updatePaginationControls() { $('#prevPageBtn').prop('disabled', currentPage === 1); $('#nextPageBtn').prop('disabled', currentPage === totalPages); }
        function prevPage() { if (currentPage > 1) { currentPage--; displayPage(); updatePaginationControls(); } }
        function nextPage() { if (currentPage < totalPages) { currentPage++; displayPage(); updatePaginationControls(); } }
        function closeModal() { $('#gachaHistoryModal').modal('hide'); }

        // ================= 干员名册逻辑 =================
        function showCharacters() { $('#resultsContainer').hide(); $('#charactersContainer').show(); loadCharacters(); }
        async function loadCharacters() {
            const container = $('#charactersContainer');
            container.html('<div class="col-12 text-center fw-bold mt-5">// LOADING OPERATOR ARCHIVES...</div>');
            try {
                const token = sessionStorage.getItem('token');
                const res = await fetch('/characters', { method: 'GET', headers: { 'Authorization': `Bearer ${token}` } });
                const { success, data, error } = await res.json();
                if (!success) throw new Error(error || '获取干员数据失败');
                displayCharacters(data);
            } catch (err) { showError(err.message); }
        }
        function displayCharacters(characters = []) {
            const container = $('#charactersContainer').empty();
            if (!characters.length) return container.html('<div class="col-12 text-center text-muted fw-bold mt-5">// 干员档案为空</div>');
            characters.forEach((char, index) => {
                const r = char.character.rarity;
                const rarityLabel = r === 5 ? '6-STAR' : (r === 4 ? '5-STAR' : '3-STAR');
                const card = `<div class="col-md-3 mb-4"><div class="flip-card character-card"><div class="flip-card-inner" style="animation-delay: ${index * 0.05}s;"><div class="flip-card-front ${getRarityClass(r)}"><div class="hg-card-label">RANK: ${rarityLabel}</div><div class="card-content"><div class="rarity-stars">${'★'.repeat(r)}</div><h4 class="item-name mb-3">${char.character.itemName}</h4><div class="mt-auto"><div class="stat-row"><span class="stat-label">HP.</span><span class="stat-val">${Math.floor(char.health)}</span></div><div class="stat-row"><span class="stat-label">ATK.</span><span class="stat-val">${Math.floor(char.attack)}</span></div><div class="stat-row"><span class="stat-label">DEF.</span><span class="stat-val">${Math.floor(char.defense)}</span></div><div class="stat-row"><span class="stat-label">CRIT.R</span><span class="stat-val">${Math.floor(char.critRate)}%</span></div><div class="stat-row"><span class="stat-label">CRIT.D</span><span class="stat-val">${Math.floor(char.critDamage)}%</span></div></div></div></div></div></div></div>`;
                container.append(card);
            });
        }
    </script>
</body>
</html>
